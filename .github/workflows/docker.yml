name: CI, Release, and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ vars.DOCKERHUB_ORG || secrets.DOCKERHUB_USERNAME || github.repository_owner }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          PIHOLE_URL: http://127.0.0.1:9
          LOKI_TARGET: http://127.0.0.1:9
        run: python -m pytest -v

  validate-images:
    name: Validate Docker Images
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metrics exporter image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.metrics
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build logs exporter image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.logs
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release and Publish
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released commit
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up QEMU
        if: steps.release.outputs.release_created == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release.outputs.release_created == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.release.outputs.release_created == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata for metrics exporter
        if: steps.release.outputs.release_created == 'true'
        id: meta_metrics
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/pihole6-metrics-exporter
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag_name }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Docker metadata for logs exporter
        if: steps.release.outputs.release_created == 'true'
        id: meta_logs
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/pihole6-logs-exporter
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag_name }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish metrics exporter image
        if: steps.release.outputs.release_created == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.metrics
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_metrics.outputs.tags }}
          labels: ${{ steps.meta_metrics.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish logs exporter image
        if: steps.release.outputs.release_created == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.logs
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_logs.outputs.tags }}
          labels: ${{ steps.meta_logs.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
